<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NOM}} · {{VILLE}}</title>
<meta name="description" content="{{PRESENTATION}}">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="haut">
  <div class="cadre">
    <p class="ville">{{VILLE}}</p>
    <h1>{{NOM}}</h1>
    <p class="intro">{{PRESENTATION}}</p>
  </div>
</header>

<main class="cadre">
  <section aria-labelledby="t-matchs">
    <h2 id="t-matchs">Prochains matchs</h2>
    {{MATCHS}}
  </section>

  <section aria-labelledby="t-resultats">
    <h2 id="t-resultats">Derniers résultats</h2>
    {{RESULTATS}}
  </section>

  <section aria-labelledby="t-entrainements">
    <h2 id="t-entrainements">Entraînements</h2>
    <div class="defile">{{ENTRAINEMENTS}}</div>
  </section>

  <section aria-labelledby="t-contact">
    <h2 id="t-contact">Nous écrire</h2>
    <p>{{CONTACT}}</p>
  </section>
</main>

<footer class="bas">
  <div class="cadre">Page mise à jour automatiquement le {{MISE_A_JOUR}}.</div>
</footer>
</body>
</html>
